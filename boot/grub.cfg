# Конфигурация GRUB для MyOS
# Загрузка ядра + InitRD модуль + графический режим VESA

# Таймаут меню (секунды)
set timeout=3
set default=0

# Устанавливаем графический режим для загрузки ядра
# GRUB настроит VESA фреймбуфер 1024x768 с 32-битным цветом
set gfxpayload=1024x768x32

# Пункт меню для загрузки MyOS
menuentry "MyOS" {
    multiboot /boot/kernel.bin
    module /boot/initrd.img
    boot
}

# Пункт для перезагрузки
menuentry "Reboot" {
    reboot
}

# Пункт для выключения
menuentry "Shutdown" {
    halt
}
