# AMPLIFY-OS installation media (BIOS path).  UEFI-машины грузят этот же ISO
# через efiboot.img с нашим BOOTX64.EFI и этот файл не читают.
#
# Режим кадра: интерфейс рисуется в логической сетке 1600x1000, а шрифты —
# в фиксированных пикселях, поэтому нужен экран не меньше ~1280 по ширине.
# GRUB берёт первый доступный режим из списка.
set timeout=5
set default=0

menuentry "Install AMPLIFY-OS (live)" {
    insmod all_video
    insmod gfxterm
    set gfxmode=1920x1080x32,1600x900x32,1280x800x32,1280x1024x32,auto
    set gfxpayload=keep
    terminal_output gfxterm
    multiboot2 /boot/kernel-x86_64.bin live installer
    module2 /boot/initrd.img amplify-initrd
    boot
}

menuentry "AMPLIFY-OS 64-bit (boot without installer)" {
    insmod all_video
    insmod gfxterm
    set gfxmode=1920x1080x32,1600x900x32,1280x800x32,1280x1024x32,auto
    set gfxpayload=keep
    terminal_output gfxterm
    multiboot2 /boot/kernel-x86_64.bin
    module2 /boot/initrd.img amplify-initrd
    boot
}
